services:
  jobfinder:
    build: .
    container_name: jobfinder_app
    ports:
      - "4567:4567"
    volumes:
      # Persist database in data/ directory (avoids single-file mount issues)
      - ./data:/app/data
      # Mount configuration
      - ./config.yml:/app/config.yml
      # Mount local CV folder
      - ./cvs:/app/cvs
      # Mount static and templates for live frontend reloading
      - ./static:/app/static
      - ./templates:/app/templates
    restart: unless-stopped
