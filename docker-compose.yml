services:
  jobfinder:
    build: .
    container_name: jobfinder_app
    ports:
      - "4567:4567"
    volumes:
      # Persist database in data/ directory (avoids single-file mount issues)
      - ./data:/app/data
      # Mount configuration
      - ./config.yml:/app/config.yml
      # Mount the private evaluator instruction without baking it into the image
      - ./llm_instruction.txt:/app/llm_instruction.txt:ro
      # Mount local CV folder
      - ./cvs:/app/cvs
      # Mount static and templates for live frontend reloading
      - ./static:/app/static
      - ./templates:/app/templates
      # Mount Python source files for live backend reloading (no rebuild needed)
      - ./app.py:/app/app.py
      - ./database.py:/app/database.py
      - ./scraper.py:/app/scraper.py
      - ./utils.py:/app/utils.py
      # Optional local-only source adapters (git-ignored, never baked into image)
      - ./private_sources:/app/private_sources:ro
    restart: unless-stopped
