# ── Server ────────────────────────────────────────────────
port: 4567
page_size: 20

# ── Application Pipeline ─────────────────────────────────
app_states:
  - "Not Applied"
  - "Postponed"
  - "Applied"
  - "Rejected"
  - "Interview"
  - "Offer"

cv_types:
  - "Software"
  - "Hardware"
  - "Data"
  - "General"

# ── Scraper Settings ──────────────────────────────────────
delay_min_ms: 1000
delay_max_ms: 1500
block_heavy_resources: true
special_keyword_threshold: 3

stellenwerk_link: "https://www.stellenwerk.de/CITY"
stellenwerk_pages: 2

stepstone_link: "https://www.stepstone.de/jobs/teilzeit/in-hamburg?FILTERS"
stepstone_pages: 1

xing_link: "YOUR_XING_SEARCH_URL"
xing_pages: 5

# Additional public adapters (leave blank to disable). Every *_link accepts
# either one URL string or a YAML list of URLs for multiple target markets.
talent_link: ""
talent_pages: 1

kimeta_link: ""
kimeta_pages: 1  # Kimeta exposes only its first result batch without a crawl challenge

glassdoor_link: ""
glassdoor_pages: 1

# Simple generic scraper for company career pages. Job links whose titles
# match the global keywords are collected. These pages were checked for
# stable, visible job listings and are safe defaults for the public example.
custom_links:
  - "https://applike-group.com/jobs/"
  - "https://adjoe.io/careers/open-positions/"
  - "https://tngtech.jobs.personio.de/"
  - "https://job-boards.eu.greenhouse.io/appinio"
  - "https://job-boards.eu.greenhouse.io/raisin?offices%5B%5D=4032009101"
  - "https://job-boards.eu.greenhouse.io/moia?field_4012826101%5B%5D=4565537101"
  - "https://job-boards.greenhouse.io/wppmedia?offices%5B%5D=4047174008"
  - "https://www.impulse.de/karriere"
  - "https://www.cbs-consulting.com/karriere-bei-cbs/stellenangebote/?_locations=hamburg&_experience=students"
  - "https://karriere.qbeyond.de/"
  - "https://karriere.materna.de/stellenmarkt/?filter%5Btaetigkeit_id%5D=4"
  - "https://job-boards.eu.greenhouse.io/capgeminideutschlandgmbh?page=1"
  - "https://www.prodyna.com/jobs?location=Hamburg&division=PRODYNA+-+Germany"
  - "https://jobs.aurubis.com/search?location=Hamburg&career_level=Studenten"
  - "https://careers.vattenfall.com/global/jobs?options=418%2C640&page=1"
  - "https://corporate.aboutyou.de/en/career/jobs"
  - "https://bewerber-innendienst.hansemerkur.de/stellenangebote.html"
  - "https://www.hamburg-port-authority.de/de/karriere/stellenangebote/stellenangebote.html"
custom_pages: 1

# ── AI Evaluator ──────────────────────────────────────────
# Set to false to disable AI evaluation entirely (no API key required)
enable_evaluator: true
gemini_api_key: "YOUR_GEMINI_API_KEY_HERE"
evaluator_model_cooldown_s: 300  # Skip unavailable/rate-limited models for 5 minutes
# General-purpose text models, ordered from highest accuracy/power to lowest
# cost/highest throughput. The evaluator switches to the next model when the
# current one is unavailable, unsupported, or rate-limited.
evaluator_models:
  - "gemini-3.1-pro-preview"
  - "gemini-2.5-pro"
  - "gemini-3.7-flash"
  - "gemini-3.6-flash"
  - "gemini-3.5-flash"
  - "gemini-3-flash-preview"
  - "gemini-2.5-flash"
  - "gemini-3.5-flash-lite"
  - "gemini-3.1-flash-lite"
  - "gemini-2.5-flash-lite"
  - "gemini-2.5-flash-lite-preview-09-2025"
evaluator_delay_s: 15

cv_paths:
  - "cvs/my_cv.pdf"

# ── Keywords ──────────────────────────────────────────────
keywords:
  - "Werkstudent"
  - "working student"
  - "Informatik"

negative_keywords:
  - "Senior"
  - "Lead"
  - "Manager"
  - "Expert"
